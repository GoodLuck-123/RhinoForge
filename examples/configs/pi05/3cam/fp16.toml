# One Pi0.5 entry; execution is selected from precision, input and core geometry.
[pi05]
precision = "fp16"

[input]
checkpoint = "pi05-libero-finetuned"
batch = "/path/to/pi05_3cam_t32_batch.pt"
cameras = 3
text_tokens = 32
num_steps = 10
# noise = "/path/to/fixed_cpu_noise.pt"

[run]
warmup = 2
runs = 6
seed = 0
output_dir = "./pi05_results/3cam/fp16"
