# Unoptimized TP4/TP6 group: serial Vision and the generic execution path.
[pi05]
precision = "fp16"

[input]
checkpoint = "pi05-libero-finetuned"
batch = "/path/to/pi05_3cam_t32_batch.pt"
cameras = 3
text_tokens = 32
num_steps = 10
# noise = "/path/to/fixed_cpu_noise.pt"

[run]
warmup = 2
runs = 6
seed = 0
output_dir = "./pi05_results/unoptimized/3cam/fp16_tp6"

[rpu_execution.model]
num_cores = 6
