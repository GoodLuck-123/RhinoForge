# T is the count of valid tokens from a complete, untruncated instruction.
[lingbot2]
precision = "w8a16"
instruction_residency = "auto"

[input]
checkpoint = "${RPU_MODEL_CACHE}/lingbot-vla-v2-6b"
training_config = "${LINGBOT2_TRAINING_CONFIG}"
observation = "${LINGBOT2_2CAM_T128_OBSERVATION}"
cameras = 2
expected_language_tokens = 128
max_language_tokens = 160

[run]
warmup = 2
runs = 5
seed = 0
output_dir = "results/lingbot2/2cam_t128/w8a16"
hwperf = false
profile = false

[cpu]
threads = 1

[rpu_execution.model]
num_cores = 8

# AUTO chooses an admitted physical layout; padding never adds valid tokens.
[rpu_execution.prefill]
padding_budget = 63
