# Actual input mask counts are checked; no synthetic token padding changes semantics.
[lingbot2]
precision = "w8a16"
instruction_residency = "auto"

[input]
checkpoint = "${RPU_MODEL_CACHE}/lingbot-vla-v2-6b"
training_config = "${LINGBOT2_TRAINING_CONFIG}"
case = "${LINGBOT2_PUBLIC_CASE}"
cameras = 3
expected_language_tokens = 3

[run]
warmup = 2
runs = 5
seed = 0
output_dir = "results/lingbot2/3cam_t3/w8a16"
hwperf = false
profile = false

[cpu]
threads = 1

[rpu_execution.model]
num_cores = 8
