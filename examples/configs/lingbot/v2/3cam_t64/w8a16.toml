# Actual input mask counts are checked; no synthetic token padding changes semantics.
[lingbot2]
precision = "w8a16"
instruction_residency = "auto"

[input]
checkpoint = "${RPU_MODEL_CACHE}/lingbot-vla-v2-6b"
training_config = "${LINGBOT2_TRAINING_CONFIG}"
observation = "${LINGBOT2_3CAM_T64_OBSERVATION}"
cameras = 3
expected_language_tokens = 64

[run]
warmup = 2
runs = 5
seed = 0
output_dir = "results/lingbot2/3cam_t64/w8a16"
hwperf = false
profile = false

[cpu]
threads = 1

[rpu_execution.model]
num_cores = 8

# Let the native planner find a legal single-chunk SDPA geometry for REAL278.
# Padding is masked; the 64 valid instruction tokens are retained.
[rpu_execution.prefill]
padding_budget = 63
