# Actual input mask counts are checked; no synthetic token padding changes semantics.
[lingbot2]
precision = "fp16"
instruction_residency = "auto"

[input]
checkpoint = "${RPU_MODEL_CACHE}/lingbot-vla-v2-6b"
training_config = "${LINGBOT2_TRAINING_CONFIG}"
observation = "${LINGBOT2_2CAM_T16_OBSERVATION}"
cameras = 2
expected_language_tokens = 16

[run]
warmup = 2
runs = 5
seed = 0
output_dir = "results/lingbot2/2cam_t16/fp16"
hwperf = false
profile = false

[cpu]
threads = 1

[rpu_execution.model]
num_cores = 8
