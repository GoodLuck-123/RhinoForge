[example]
profile_id = "qwen3_5-0.8b.fp16.text"
registry_alias = "qwen3_5-0.8b"
target = "qwen3_5"
dtype = "fp16"
architecture = "Qwen3_5ForConditionalGeneration"

[example.opt_in]

[input]
prompt = "Explain what a compiler does."
decode_steps = 4

[run]
warmup = 2
runs = 3
hwperf = false
profile = false
seed = 0

[rpu_execution]

[rpu_execution.prefill]
chunk_size = "auto"

# Cold compute budget: 4, 6 or 8 (default 8); changing it needs a fresh model.
# Six uses attention/GDN/head/Vision4 and MLP6, with cold MLP3584->3648 padding.
