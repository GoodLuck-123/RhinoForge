# MLP RTN W4/G32 + Attention/GDN W8，受控纯文本：batch 1、TP8、ACC16。
# 权重准备与缓存目录：examples/configs/qwen3_5/README.md
[example]
profile_id = "qwen3_5-2b.w4-mlp-w8-attn-gdn-g32.text-controlled"
registry_alias = "qwen3_5-2b-w4-mlp-w8-attn-gdn-g32"
target = "qwen3_5"
dtype = "w4a16"
architecture = "Qwen3_5ForConditionalGeneration"

[example.opt_in]
QWEN3_5_QUANT_ALLOW_UNCERTIFIED = "1"

[input]
prompt = "Explain what a compiler does."
decode_steps = 4

[run]
warmup = 2
runs = 5
inference_mode = true
timing_mode = "per_call"
hwperf = false
profile = false
seed = 0

[rpu_execution.model]
num_cores = 8

[rpu_execution.prefill]
chunk_size = "auto"
linear_acc32 = false

[cpu]
threads = 4
