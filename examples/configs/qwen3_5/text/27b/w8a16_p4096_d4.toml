
[example]
profile_id = "qwen3_5-27b.w8a16.text-controlled"
registry_alias = "qwen3_5-27b-w8a16"
target = "qwen3_5"
dtype = "w8a16"
architecture = "Qwen3_5ForConditionalGeneration"

[example.opt_in]
QWEN3_5_QUANT_ALLOW_UNCERTIFIED = "1"

[input]
prompt = "Explain what a compiler does."
decode_steps = 4
prefill_tokens = 4096

[run]
warmup = 2
runs = 5
inference_mode = true
timing_mode = "per_call"
hwperf = false
profile = false
seed = 0

[rpu_execution.model]
num_cores = 8

[rpu_execution.prefill]
chunk_size = "auto"
linear_acc32 = false

[cpu]
threads = 8
