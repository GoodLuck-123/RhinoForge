# 已归档的 Qwen3.8-27B 历史复现；新运行请使用 qwen3_5/text/27b/ 中的官方配置。
[example]
profile_id = "qwen3_8-27b.w8a16.text-controlled-tp4"
registry_alias = "qwen3_8-27b-w8a16"
target = "qwen3_5"
dtype = "w8a16"
architecture = "Qwen3_5ForConditionalGeneration"

[example.opt_in]
QWEN3_5_QUANT_ALLOW_UNCERTIFIED = "1"

[input]
prompt = "Explain what a compiler does."
decode_steps = 31  # maximum32 generated tokens including prefill; stop on EOS

[run]
warmup = 2
runs = 3
hwperf = false
profile = false
seed = 0

[rpu_execution.prefill]
# AUTO or exact 64/128; native feasibility remains authoritative.
chunk_size = "auto"

[rpu_execution.model]
num_cores = 4
