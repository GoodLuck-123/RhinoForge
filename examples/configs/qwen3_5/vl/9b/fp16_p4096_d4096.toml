# Dense VL image + language generation; see ../../README.md for profile notes.
# Run from the repository root. The image is resized once before measurement.
[example]
profile_id = "qwen3_5-9b.fp16.vision-controlled"
registry_alias = "qwen3_5-9b"
target = "qwen3_5_vision"
dtype = "fp16"
architecture = "Qwen3_5ForConditionalGeneration"

[example.opt_in]
QWEN3_5_VISION_ALLOW_NUMERIC_BLOCKED = "1"

[input]
images = ["python/rpu_backend/tests/model/wall_oss/assets/test_frame.png"]
image_size = 448
prompt = "Describe the image in detail. A compiler translates source code into executable instructions. Explain the stages of compilation and give examples. "
prefill_filler_prompt = "A compiler translates source code into executable instructions. Explain the stages of compilation and give examples. "
prefill_tokens = 4096
decode_steps = 4096
stop_on_eos = false

[run]
warmup = 2
runs = 3
inference_mode = true
timing_mode = "legacy_dense_vl"
summary_statistic = "median"
hwperf = false
profile = false
seed = 0

[rpu_execution.model]
num_cores = 8

[rpu_execution.prefill]
chunk_size = "auto"

[cpu]
threads = 12
