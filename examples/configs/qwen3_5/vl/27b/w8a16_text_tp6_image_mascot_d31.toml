# Supply the matching r1_mascot.jpeg fixture; a different image is a different condition.

[example]
profile_id = "qwen3_5-27b.w8a16.vision-controlled-tp6"
registry_alias = "qwen3_5-27b-w8a16"
target = "qwen3_5_vision"
dtype = "w8a16"
architecture = "Qwen3_5ForConditionalGeneration"

[example.opt_in]
QWEN3_5_QUANT_ALLOW_UNCERTIFIED = "1"
QWEN3_5_VISION_ALLOW_NUMERIC_BLOCKED = "1"

[input]
images = ["/path/to/r1_mascot.jpeg"]
prompt = "Describe this image briefly."
decode_steps = 31
stop_on_eos = false

[run]
warmup = 2
runs = 5
inference_mode = true
timing_mode = "per_call"
hwperf = false
profile = false
seed = 0

[rpu_execution.model]
num_cores = 6

[rpu_execution.prefill]
chunk_size = "auto"
linear_acc32 = false

[rpu_execution.vision]
chunk_size = "auto"
linear_acc32 = false

[cpu]
threads = 8
