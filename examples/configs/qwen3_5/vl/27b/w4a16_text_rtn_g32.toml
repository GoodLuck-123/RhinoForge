
[example]
profile_id = "qwen3_5-27b.w4a16.vision-controlled"
registry_alias = "qwen3_5-27b-w4a16"
target = "qwen3_5_vision"
dtype = "w4a16"
architecture = "Qwen3_5ForConditionalGeneration"

[example.opt_in]
QWEN3_5_QUANT_ALLOW_UNCERTIFIED = "1"
QWEN3_5_VISION_ALLOW_NUMERIC_BLOCKED = "1"

[input]
images = ["python/rpu_backend/tests/model/wall_oss/assets/test_frame.png"]
prompt = "Describe the image."
decode_steps = 32
stop_on_eos = false

[run]
warmup = 2
runs = 5
inference_mode = true
timing_mode = "per_call"
hwperf = false
profile = false
seed = 0

[rpu_execution.model]
num_cores = 8

[rpu_execution.prefill]
chunk_size = "auto"
linear_acc32 = false

[rpu_execution.vision]
chunk_size = "auto"
linear_acc32 = false

[cpu]
threads = 8
