[example]
profile_id = "qwen3_5-2b.fp16.vision-controlled"
registry_alias = "qwen3_5-2b"
target = "qwen3_5_vision"
dtype = "fp16"
architecture = "Qwen3_5ForConditionalGeneration"

[example.opt_in]
QWEN3_5_VISION_ALLOW_NUMERIC_BLOCKED = "1"

[input]
images = ["/path/to/image.png"]
prompt = "Describe the image."
decode_steps = 4

[run]
warmup = 2
runs = 3
hwperf = false
profile = false
seed = 0

[rpu_execution]

[rpu_execution.prefill]
chunk_size = "auto"

[rpu_execution.vision]
chunk_size = "auto"

# Cold compute budget: 4, 6 or 8 (default 8). Core changes require a fresh model.
# Six uses Vision/attention/GDN/head on 4 cores and the text MLP on 6.
# [rpu_execution.model]
# num_cores = 6
