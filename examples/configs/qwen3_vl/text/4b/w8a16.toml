# Runtime scope: Text7 + lm_head w8a16; Vision W8A16; activations FP16.
# W4 uses preserved AWQ/G32 at 2B/4B/8B and RTN/G32 at 32B.
# 31 decode calls + the prefill token = 32 output tokens.
[example]
profile_id = "qwen3-vl-4b-runtime-w8a16.w8a16.text"
registry_alias = "qwen3-vl-4b-runtime-w8a16"
target = "qwen3_vl"
dtype = "w8a16"
architecture = "Qwen3VLForConditionalGeneration"

[example.opt_in]

[input]
component = "text"
prompt = "Explain what a compiler does."
prefill_tokens = 512
decode_steps = 31
stop_on_eos = false

[run]
warmup = 2
runs = 5
inference_mode = false
hwperf = false
profile = false
seed = 0

[rpu_execution.model]
num_cores = 8

[rpu_execution.prefill]
chunk_size = "auto"
linear_acc32 = false
fast_replay = true

[rpu_execution.vision]
chunk_size = "auto"
linear_acc32 = false
