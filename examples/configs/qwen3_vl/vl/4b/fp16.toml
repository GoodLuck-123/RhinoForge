[example]
profile_id = "qwen3-vl-4b.fp16.multimodal"
registry_alias = "qwen3-vl-4b"
target = "qwen3_vl"
dtype = "fp16"
architecture = "Qwen3VLForConditionalGeneration"

[example.opt_in]

[input]
component = "multimodal"
prompt = "Describe the image."
decode_steps = 4
images = ["/path/to/image.png"]

[run]
warmup = 2
runs = 3
hwperf = false
profile = false
seed = 0

[rpu_execution]

# Optional cold 4/6-core budget.
# No formal certificate or universal performance claim for reduced budgets.
# Default remains 8. At 6: Vision 4, text 4/6/4.
# MLP 9728→9792 padding is completed during preparation.
# [rpu_execution.model]
# num_cores = 6

[rpu_execution.prefill]
fast_replay = true
chunk_size = "auto"

[rpu_execution.vision]
chunk_size = "auto"
