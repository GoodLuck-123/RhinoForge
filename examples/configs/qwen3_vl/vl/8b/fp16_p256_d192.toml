[example]
profile_id = "qwen3-vl-8b.fp16.multimodal"
registry_alias = "qwen3-vl-8b"
target = "qwen3_vl"
dtype = "fp16"
architecture = "Qwen3VLForConditionalGeneration"

[example.opt_in]

[input]
component = "multimodal"
prompt = "Describe this image in one sentence."
prefill_tokens = 256
decode_steps = 192
stop_on_eos = false
images = ["/path/to/image.png"]

[run]
warmup = 2
runs = 1
inference_mode = false
hwperf = false
profile = false
seed = 0

[rpu_execution]

# Optional cold 4/6-core budget.
# No formal certificate or universal performance claim for reduced budgets.
# Default remains 8. At 6: Vision 4, text 4/6/4; existing Vision padding is preserved.
# [rpu_execution.model]
# num_cores = 6

[rpu_execution.prefill]
fast_replay = true
chunk_size = "auto"

[rpu_execution.vision]
chunk_size = "auto"
