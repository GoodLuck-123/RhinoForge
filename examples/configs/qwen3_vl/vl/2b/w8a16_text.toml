# Original Text-only W8: seven decoder projections only; head/Vision FP16.
# This recipe is separate from runtime W8/W4 and uses its own evidence.
# 31 decode calls + the prefill token = 32 output tokens.
[example]
profile_id = "qwen3-vl-2b-text-w8a16.w8a16.multimodal"
registry_alias = "qwen3-vl-2b-text-w8a16"
target = "qwen3_vl"
dtype = "w8a16"
architecture = "Qwen3VLForConditionalGeneration"

[example.opt_in]

[input]
component = "multimodal"
prompt = "Describe this image in one sentence."
prefill_tokens = 430
decode_steps = 31
stop_on_eos = false
images = ["/path/to/image_640x480.png"]

[run]
warmup = 2
runs = 5
inference_mode = false
hwperf = false
profile = false
seed = 0

[rpu_execution.model]
num_cores = 8

[rpu_execution.prefill]
chunk_size = "auto"
linear_acc32 = false
fast_replay = true

[rpu_execution.vision]
chunk_size = "auto"
linear_acc32 = false
