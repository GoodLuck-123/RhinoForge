# Controlled evaluation only; no device numeric/Graph/performance certification.
# See docs/model_assets.md for asset identity limits.
[example]
profile_id = "qwen3-vl-32b.w8a16.multimodal-controlled"
registry_alias = "qwen3-vl-32b-w8a16"
target = "qwen3_vl"
dtype = "w8a16"
architecture = "Qwen3VLForConditionalGeneration"

[example.opt_in]
QWEN3_VL_32B_ALLOW_GRAPH_BLOCKED = "1"

[input]
component = "multimodal"
prompt = "Describe the image."
decode_steps = 4
images = ["/path/to/image.png"]

[run]
warmup = 2
runs = 3
hwperf = false
profile = false
seed = 0

[rpu_execution]

[rpu_execution.prefill]
chunk_size = "auto"

[rpu_execution.vision]
chunk_size = "auto"
