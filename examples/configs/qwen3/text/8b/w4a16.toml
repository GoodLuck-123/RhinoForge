# Official dense Qwen3-8B source, converted once during cold installation.
# Decoder seven projections: symmetric INT4/G32; lm_head: FP16.
# TP8/B1, default ACC16; bounded P128/D7 ACC16 numerics/Graph checks archived.
# Unmeasured length/ACC combinations and task quality are not certified.
[example]
profile_id = "qwen3-8b.w4a16-g32.text"
registry_alias = "qwen3-8b"
target = "qwen3"
dtype = "w4a16"
architecture = "Qwen3ForCausalLM"

[example.opt_in]

[input]
prompt = "Explain what a compiler does."
prefill_tokens = 128
decode_steps = 7
stop_on_eos = false

[run]
warmup = 2
runs = 5
hwperf = false
profile = false
seed = 0

[rpu_execution.model]
num_cores = 8

[rpu_execution.prefill]
chunk_size = "auto"
linear_acc32 = false
