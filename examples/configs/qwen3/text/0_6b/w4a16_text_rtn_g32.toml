# Quantize the official FP16 asset once during cold installation.
# Decoder seven projections: symmetric INT4/G32; head/embed/norm: FP16.
# Exact Qwen3-0.6B, TP8/B1; no per-channel W4 or other size is implied.
[example]
profile_id = "qwen3-0.6b.w4a16-g32.text"
registry_alias = "qwen3-0.6b"
target = "qwen3"
dtype = "w4a16"
architecture = "Qwen3ForCausalLM"

[example.opt_in]

[input]
prompt = "Explain what a compiler does."
prefill_tokens = 128
decode_steps = 7
stop_on_eos = false

[run]
warmup = 2
runs = 5
hwperf = false
profile = false
seed = 0

[rpu_execution.model]
num_cores = 8

[rpu_execution.prefill]
chunk_size = "auto"
linear_acc32 = false
