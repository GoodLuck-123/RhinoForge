# V3 RTC: same precision and optimizations as w8a16_action.toml.
# factory.json must set rtc=true; request.pt supplies action_prefix and delay=0..6.
[example]
profile_id = "rhinovla.v3.rtc.w8a16.expert.trusted-factory"
registry_alias = "rhinovla-controlled"
target = "rhinovla"
dtype = "w8a16"

[example.opt_in]
RPU_RHINOVLA_VISION_BATCH_VIEWS = "1"
RPU_RHINOVLA_VISION_PREP_CACHE = "1"
RPU_RHINOVLA_DENOISE_STATIC_CONTEXT_CACHE = "1"
RPU_RHINOVLA_PRECOMPUTE_ADARMS = "1"
RPU_RHINOVLA_GATED_NO_SUB = "1"
RPU_RHINOVLA_FUSED_SILU_MUL = "1"
RPU_RHINOVLA_EXPERT_FUSIONS = "1"
RPU_RHINOVLA_ADARMS_RESIDENT = "1"
RPU_RHINOVLA_ALIGNED_KV = "1"
RPU_RHINOVLA_FULL_W8A16 = "0"
RPU_RHINOVLA_EXPERT_W8A16 = "0"
RPU_RHINOVLA_PACKED_QKV = "0"
RPU_RHINOVLA_SKIP_ADARMS_GEMV = "0"

[input]
checkpoint = "/path/to/rhinovla-v3/checkpoint"
runtime_factory = "rpu_backend.adapters.rhinovla.factory:v3_runtime_factory"
request = "/path/to/rhinovla-v3/rtc_request.pt"
factory_config = "/path/to/rhinovla-v3/rtc_factory.json"
trust_model_code = true
num_steps = 10
expert_w8a16 = true
full_w8a16 = false

[run]
warmup = 2
runs = 3
hwperf = false
profile = false
seed = 0

[rpu_execution.components.vision_encoder.vision]
chunk_size = "auto"
rpu_patch_embed = true
rpu_mergers = true
fused_merger = true
fast_replay = true
preload_replay_skip = true
bake_merger = true

[rpu_execution.components.language_model.prefill]
chunk_size = "auto"
prefix_prep_cache = true
prefix_prep_rpu = true
prefix_no_clone = true
partial_mrope = true
merger_scatter = true
fast_replay = true
preload_replay_skip = true

[rpu_execution.components.action_expert.action]
chunk_size = "auto"
denoise_unroll = true
shared_cache = true
prefix_alias = true
fast_replay = true
